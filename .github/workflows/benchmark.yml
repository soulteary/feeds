name: Benchmarks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .github/go-version
          cache: false
      - name: Run allocation and timing benchmarks
        env:
          GOMAXPROCS: '1'
        run: go test -run '^$' -bench 'BenchmarkFeedFormats|BenchmarkXMLExtensions' -benchmem -count=5 -cpu=1 > benchmark.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-benchmarks
          path: benchmark.txt

name: Compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            go: '1.20.x'
          - os: ubuntu-latest
            go: '1.27.4'
          - os: macos-latest
            go: '1.27.4'
          - os: windows-latest
            go: '1.27.4'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -race ./...
      - run: go vet ./...

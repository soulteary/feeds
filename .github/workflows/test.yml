name: Compatibility
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            go: '1.20.x'
          - os: ubuntu-latest
            go: '1.27.3'
          - os: macos-latest
            go: '1.27.3'
          - os: windows-latest
            go: '1.27.3'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test -race ./...
      - run: go vet ./...

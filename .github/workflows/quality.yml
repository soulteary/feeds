name: Go quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: soulteary/go-test-report-action@2760569379a1c95a195c602872ba00cd61495d89 # v1.1.3
        with:
          version: v1.1.3
          go_version_file: .github/go-version
          race: 'true'
          coverage_threshold: '100'
          package_threshold: '100'
          commit: 'false'
      - uses: soulteary/goreportcard-action@d4669a9fbea514f5995d749177630ebfee755789 # v1.1.4
        with:
          version: v1.1.4
          go_version_file: .github/go-version
          commit: 'false'
      - name: Differential name fuzzing
        run: go test -run '^$' -fuzz '^FuzzExtensionNameCompatibility$' -fuzztime=10s -parallel=2
      - name: Differential text fuzzing
        run: go test -run '^$' -fuzz '^FuzzExtensionTextCompatibility$' -fuzztime=10s -parallel=2
      - name: Vet
        run: go vet ./...
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-quality-reports
          include-hidden-files: true
          path: |
            .github/coverage.svg
            .github/go-test-report.md
            .github/go-test-report.json
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: go-quality-reports
          path: .github
      - name: Commit reports for the tested revision
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ]; then
            echo "main has changed; leaving reports as workflow artifacts."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/coverage.svg .github/go-test-report.md .github/go-test-report.json .github/goreportcard.svg .github/goreportcard-report.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update Go quality reports [skip ci]'
            git push origin HEAD:main
          fi
